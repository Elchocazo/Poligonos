<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliLab: Geometría Interactiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { touch-action: none; overflow: hidden; }
        .canvas-container { position: relative; cursor: crosshair; background-color: #f8fafc; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        #reward-modal, #pets-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .pet-card { transition: all 0.2s; cursor: pointer; }
        .locked { filter: grayscale(1) opacity(0.4); }
        
        #active-pet-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 40;
            transition: all 0.5s ease;
        }
        .speech-bubble {
            background: white;
            border: 3px solid #4f46e5;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 800;
            color: #1e1b4b;
            max-width: 220px;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            right: 30px;
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #4f46e5 transparent;
        }
        .pet-sprite {
            font-size: 70px;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.1));
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-15px) rotate(5deg); } }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-sm shrink-0">
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center px-8">
            <div class="flex items-center gap-4">
                <span class="text-4xl">📐</span>
                <div>
                    <h1 class="text-2xl font-black leading-none">PoliLab Pro</h1>
                    <p class="text-xs uppercase opacity-80 font-bold tracking-widest">Laboratorio de Polígonos</p>
                </div>
            </div>
            
            <div class="flex gap-4">
                <div class="bg-yellow-400 text-yellow-950 px-5 py-2 rounded-2xl flex items-center gap-3 shadow-[0_4px_0_rgb(202,138,4)]">
                    <span class="text-2xl">⭐</span>
                    <span id="stars-count" class="text-3xl font-black">0</span>
                </div>
                <div class="bg-indigo-800/50 px-4 py-2 rounded-2xl text-center border border-indigo-400/30">
                    <span class="text-[10px] font-bold block text-indigo-200 uppercase">Nivel Geométrico</span>
                    <span id="grade-display" class="text-2xl font-black text-white">0.0</span>
                </div>
            </div>
        </div>
        
        <div class="flex justify-center gap-10 bg-white border-b border-slate-200">
            <button id="tab-explorer" class="px-8 py-4 tab-active transition-all">🎨 Constructor Libre</button>
            <button id="tab-geometry" class="px-8 py-4 text-slate-400 font-bold hover:text-indigo-500 transition-all">📏 Análisis de 6to</button>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row p-6 gap-6 overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-full md:w-80 bg-white rounded-[2rem] shadow-xl p-6 flex flex-col gap-5 shrink-0 border border-slate-200 overflow-y-auto">
            
            <div id="controls-explorer" class="space-y-4">
                <div class="bg-indigo-50 p-5 rounded-3xl border-2 border-indigo-100 text-center">
                    <p class="text-xs text-indigo-500 font-black uppercase mb-1">Vértices Marcados</p>
                    <div class="text-5xl font-black text-indigo-700" id="current-points-display">0</div>
                </div>

                <button id="btn-save-shape" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-5 rounded-3xl shadow-[0_6px_0_rgb(5,150,105)] transition-all active:translate-y-1 active:shadow-none flex flex-col items-center">
                    <span class="text-xl">✨ ¡PINTAR FIGURA!</span>
                    <span class="text-[10px] uppercase opacity-90">Verificar y ganar estrellas</span>
                </button>

                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-open-rewards" class="bg-pink-100 hover:bg-pink-200 text-pink-700 font-extrabold py-4 rounded-2xl transition-colors flex flex-col items-center border-b-4 border-pink-300">
                        <span class="text-2xl">🏆</span>
                        <span class="text-[10px]">PREMIOS</span>
                    </button>
                    <button id="btn-open-pets" class="bg-orange-100 hover:bg-orange-200 text-orange-700 font-extrabold py-4 rounded-2xl transition-colors flex flex-col items-center border-b-4 border-orange-300">
                        <span class="text-2xl">🐶</span>
                        <span class="text-[10px]">MASCOTAS</span>
                    </button>
                </div>
            </div>

            <div id="controls-geometry" class="hidden space-y-4">
                <!-- Seccion de 6to omitida por brevedad pero funcional en logica -->
                <p class="text-center text-slate-400 font-bold text-sm italic">Herramientas de medición activas</p>
            </div>

            <div class="mt-auto pt-4 border-t border-slate-100">
                <button id="btn-reset-all" class="w-full text-slate-400 hover:text-red-500 text-xs font-black uppercase tracking-widest transition-colors py-2">Reiniciar Lienzo</button>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-grow bg-white rounded-[3rem] shadow-2xl border-[12px] border-slate-50 canvas-container overflow-hidden" id="canvas-wrapper">
            <canvas id="polygonCanvas"></canvas>
            
            <div id="active-pet-container" class="hidden">
                <div class="speech-bubble" id="pet-speech">¡Hola! Dibuja un polígono sin cruzar las líneas.</div>
                <div class="pet-sprite" id="pet-display">🐱</div>
            </div>

            <div id="feedback-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center transition-all duration-300 opacity-0 z-50">
                <div id="feedback-message" class="bg-white/95 backdrop-blur-md p-10 rounded-[4rem] shadow-2xl text-center border-8"></div>
            </div>
        </div>
    </main>

    <!-- Modales -->
    <div id="reward-modal">
        <div class="bg-white rounded-[3.5rem] p-10 max-w-xl w-full mx-4 shadow-2xl">
            <div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-black text-pink-600">🏆 Medallas</h2><button onclick="closeModals()" class="text-2xl">✕</button></div>
            <div id="stickers-grid" class="grid grid-cols-3 gap-4 h-80 overflow-y-auto"></div>
        </div>
    </div>

    <div id="pets-modal">
        <div class="bg-white rounded-[3.5rem] p-10 max-w-2xl w-full mx-4 shadow-2xl">
            <div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-black text-orange-600">🐾 Tus Mascotas</h2><button onclick="closeModals()" class="text-2xl">✕</button></div>
            <div id="pets-grid" class="grid grid-cols-3 sm:grid-cols-5 gap-4 h-96 overflow-y-auto p-2"></div>
            <div class="mt-6 text-center font-black text-orange-800 bg-orange-50 py-3 rounded-2xl">Estrellas: <span id="pet-stars-display">0</span> ⭐</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('polygonCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        
        let state = {
            stars: 0,
            grade: 0,
            points: [],
            shapes: [],
            isClosed: false,
            unlockedPets: [0], // Gato gratis
            activePet: 0
        };

        const MASCOTAS = [
            { id: 0, icon: "🐱", name: "Michi", cost: 0 },
            { id: 1, icon: "🐶", name: "Bobby", cost: 100 },
            { id: 2, icon: "🐰", name: "Tambor", cost: 250 },
            { id: 3, icon: "🦊", name: "Foxy", cost: 500 },
            { id: 4, icon: "🐻", name: "Oso", cost: 800 },
            { id: 5, icon: "🐼", name: "Panda", cost: 1200 },
            { id: 6, icon: "🦁", name: "Simba", cost: 1800 },
            { id: 7, icon: "🦖", name: "T-Rex", cost: 2500 },
            { id: 8, icon: "🦄", name: "Uni", cost: 3500 },
            { id: 9, icon: "🦉", name: "Búho", cost: 5000 },
            { id: 10, icon: "🤖", name: "Robo", cost: 7000 },
            { id: 11, icon: "👽", name: "Zog", cost: 10000 },
            { id: 12, icon: "🧙", name: "Merlín", cost: 15000 },
            { id: 13, icon: "🐲", name: "Draco", cost: 25000 },
            { id: 14, icon: "🌌", name: "Cosmos", cost: 50000 }
        ];

        const CONSEJOS = [
            "¡Recuerda: los polígonos no pueden tener líneas cruzadas!",
            "Un polígono de 5 lados se llama Pentágono.",
            "¡El círculo no tiene vértices, por eso no es un polígono!",
            "¡Buen trabajo! Cada vértice que pongas te dará más estrellas.",
            "Para terminar la figura, haz clic en el círculo rojo.",
            "¡Intenta dibujar un Octágono! Tiene 8 lados.",
            "¡Vaya! Estás convirtiéndote en un experto en geometría."
        ];

        function resize() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            render();
        }
        window.addEventListener('resize', resize);
        resize();

        // Detectar si dos líneas se cruzan (Geometría Computacional Básica)
        function linesIntersect(p1, p2, p3, p4) {
            const det = (p2.x - p1.x) * (p4.y - p3.y) - (p4.x - p3.x) * (p2.y - p1.y);
            if (det === 0) return false;
            const lambda = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / det;
            const gamma = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        function isSelfIntersecting(pts) {
            if (pts.length < 4) return false;
            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 2; j < pts.length; j++) {
                    if (i === 0 && j === pts.length - 1) continue;
                    const p1 = pts[i], p2 = pts[(i + 1) % pts.length];
                    const p3 = pts[j], p4 = pts[(j + 1) % pts.length];
                    if (linesIntersect(p1, p2, p3, p4)) return true;
                }
            }
            return false;
        }

        canvas.addEventListener('mousedown', (e) => {
            if (state.isClosed) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (state.points.length >= 3) {
                const d = Math.hypot(x - state.points[0].x, y - state.points[0].y);
                if (d < 25) {
                    state.isClosed = true;
                    updatePetSpeech("¡Genial! Ahora pulsa el botón verde para ganar estrellas.");
                    render();
                    return;
                }
            }
            state.points.push({x, y});
            document.getElementById('current-points-display').innerText = state.points.length;
            render();
        });

        document.getElementById('btn-save-shape').onclick = () => {
            if (!state.isClosed) {
                updatePetSpeech("¡Ey! Primero debes cerrar la figura uniendo el principio con el final.");
                showFeedback("❌ FIGURA ABIERTA", "border-red-500 text-red-600");
                return;
            }

            if (isSelfIntersecting(state.points)) {
                updatePetSpeech("¡Oh no! Las líneas se cruzan. Un polígono correcto no debe cruzarse.");
                showFeedback("❌ LINEAS CRUZADAS", "border-orange-500 text-orange-600");
                // Reset temporal para reintentar
                state.isClosed = false;
                render();
                return;
            }

            // ÉXITO: Cálculo de puntos
            const numSides = state.points.length;
            const starsGained = 10 + (numSides - 3) * 10;
            state.stars += starsGained;
            state.grade = Math.min(5, state.grade + 0.1);
            
            state.shapes.push({
                points: [...state.points],
                color: `hsl(${Math.random() * 360}, 75%, 60%)`
            });

            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            showFeedback(`✅ ¡POLÍGONO LOGRADO!<br><span class="text-3xl">+${starsGained} ⭐</span>`, "border-emerald-500 text-emerald-600");
            
            // RESET PARA SIGUIENTE FIGURA
            state.points = [];
            state.isClosed = false;
            document.getElementById('current-points-display').innerText = "0";
            updateUI();
            render();
        };

        function updateUI() {
            document.getElementById('stars-count').innerText = state.stars;
            document.getElementById('grade-display').innerText = state.grade.toFixed(1);
            document.getElementById('pet-stars-display').innerText = state.stars;
            updatePetDisplay();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Grid de fondo
            ctx.strokeStyle = "#f1f5f9";
            ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

            // Dibujar figuras guardadas
            state.shapes.forEach(s => {
                ctx.beginPath();
                ctx.fillStyle = s.color + "33";
                ctx.strokeStyle = s.color;
                ctx.lineWidth = 4;
                ctx.lineJoin = "round";
                ctx.moveTo(s.points[0].x, s.points[0].y);
                s.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.closePath(); ctx.fill(); ctx.stroke();
            });

            // Dibujar trazo actual
            if (state.points.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = "#4f46e5";
                ctx.lineWidth = 4;
                ctx.setLineDash(state.isClosed ? [] : [10, 5]);
                ctx.moveTo(state.points[0].x, state.points[0].y);
                state.points.forEach(p => ctx.lineTo(p.x, p.y));
                if (state.isClosed) {
                    ctx.closePath();
                    ctx.fillStyle = isSelfIntersecting(state.points) ? "#f8717144" : "#4f46e522";
                    ctx.fill();
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Vértices
                state.points.forEach((p, i) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, i === 0 ? 10 : 5, 0, Math.PI*2);
                    ctx.fillStyle = i === 0 ? "#ef4444" : "#4f46e5";
                    ctx.fill();
                    if(i === 0) { // Glow para el primer punto
                        ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
                    }
                });
            }
        }

        // --- Sistema de Mascotas ---
        document.getElementById('btn-open-pets').onclick = () => {
            const grid = document.getElementById('pets-grid');
            grid.innerHTML = "";
            MASCOTAS.forEach(p => {
                const unlocked = state.unlockedPets.includes(p.id);
                const active = state.activePet === p.id;
                const card = document.createElement('div');
                card.className = `p-4 rounded-3xl border-4 pet-card text-center ${unlocked ? (active ? 'bg-orange-100 border-orange-500' : 'bg-slate-50 border-slate-200') : 'bg-slate-100 border-transparent locked'}`;
                card.innerHTML = `
                    <div class="text-4xl mb-2">${p.icon}</div>
                    <div class="text-[10px] font-black uppercase text-slate-700">${p.name}</div>
                    ${!unlocked ? `<button onclick="event.stopPropagation(); buyPet(${p.id}, ${p.cost})" class="mt-2 bg-indigo-600 text-white text-[9px] px-3 py-1 rounded-full font-bold">${p.cost}⭐</button>` : `<span class="text-[9px] font-bold ${active ? 'text-orange-600' : 'text-slate-400'}">${active ? 'ACTIVO' : 'ELEGIR'}</span>`}
                `;
                card.onclick = () => { if(unlocked) { state.activePet = p.id; updateUI(); document.getElementById('btn-open-pets').onclick(); } };
                grid.appendChild(card);
            });
            document.getElementById('pets-modal').style.display = 'flex';
        };

        window.buyPet = (id, cost) => {
            if (state.stars >= cost) {
                state.stars -= cost;
                state.unlockedPets.push(id);
                state.activePet = id;
                updateUI();
                document.getElementById('btn-open-pets').onclick();
                confetti({ colors: ['#f97316'] });
            }
        };

        function updatePetDisplay() {
            const container = document.getElementById('active-pet-container');
            container.classList.remove('hidden');
            const pet = MASCOTAS.find(m => m.id === state.activePet);
            document.getElementById('pet-display').innerText = pet.icon;
        }

        function updatePetSpeech(txt) {
            document.getElementById('pet-speech').innerText = txt;
        }

        setInterval(() => {
            if(!state.isClosed && state.points.length === 0) {
                updatePetSpeech(CONSEJOS[Math.floor(Math.random() * CONSEJOS.length)]);
            }
        }, 12000);

        function showFeedback(html, classes) {
            const ov = document.getElementById('feedback-overlay');
            const msg = document.getElementById('feedback-message');
            msg.innerHTML = html;
            msg.className = `bg-white/95 backdrop-blur-md p-10 rounded-[4rem] shadow-2xl text-center border-8 font-black text-4xl ${classes}`;
            ov.style.opacity = "1";
            ov.style.transform = "scale(1)";
            setTimeout(() => { ov.style.opacity = "0"; ov.style.transform = "scale(0.9)"; }, 2000);
        }

        function closeModals() {
            document.getElementById('reward-modal').style.display = 'none';
            document.getElementById('pets-modal').style.display = 'none';
        }

        document.getElementById('btn-reset-all').onclick = () => {
            if(confirm("¿Estás seguro de que quieres borrar todos tus dibujos?")) {
                state.shapes = [];
                state.points = [];
                state.isClosed = false;
                render();
            }
        };

        updateUI();
    </script>
</body>
</html>
