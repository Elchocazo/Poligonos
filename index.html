<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliLab: Geometría Creativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { touch-action: none; overflow: hidden; }
        .canvas-container { position: relative; cursor: crosshair; background-color: #f8fafc; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        #reward-modal, #pets-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .sticker-card, .pet-card { transition: all 0.3s ease; cursor: pointer; }
        .locked { filter: grayscale(1) opacity(0.5); }
        .badge-anim { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        
        /* Animación de la mascota en pantalla */
        #active-pet-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 40;
        }
        .speech-bubble {
            background: white;
            border: 2px solid #4f46e5;
            border-radius: 15px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #4f46e5;
            max-width: 180px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #4f46e5 transparent;
        }
        .pet-sprite {
            font-size: 60px;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Encabezado con Marcadores -->
    <header class="bg-white shadow-md shrink-0">
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center px-8">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🎨</span>
                <div>
                    <h1 class="text-xl font-bold leading-none">PoliLab Creativo</h1>
                    <p class="text-[10px] uppercase opacity-70 tracking-tighter">Dibuja y Colecciona</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <!-- Contador de Estrellas -->
                <div class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-2xl flex items-center gap-2 shadow-lg border-b-4 border-yellow-600">
                    <span class="text-xl">⭐</span>
                    <span id="stars-count" class="text-2xl font-black">0</span>
                </div>
                <!-- Nota / Nivel -->
                <div class="bg-white/20 px-4 py-2 rounded-2xl text-center min-w-[80px]">
                    <span class="text-[9px] font-bold block text-white uppercase">Tu Nota</span>
                    <span id="grade-display" class="text-xl font-black text-white">0.0</span>
                </div>
            </div>
        </div>
        
        <div class="flex justify-center gap-8 bg-white border-b">
            <button id="tab-explorer" class="px-6 py-3 tab-active">🎨 Dibujo Libre (2°)</button>
            <button id="tab-geometry" class="px-6 py-3 text-gray-500">📐 Geometría Pro (6°)</button>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- Panel Lateral -->
        <div class="w-full md:w-72 bg-white rounded-3xl shadow-md p-5 flex flex-col gap-4 shrink-0 border-t-4 border-indigo-500 overflow-y-auto">
            
            <!-- Controles 2do Grado -->
            <div id="controls-explorer" class="flex flex-col gap-4">
                <div class="bg-blue-50 p-4 rounded-2xl border-2 border-blue-100 text-center">
                    <p class="text-xs text-blue-600 font-bold uppercase mb-1">¡Dibuja una figura!</p>
                    <div class="text-3xl font-black text-blue-700" id="current-points-display">0</div>
                    <p class="text-[10px] text-blue-400 uppercase">Puntos marcados</p>
                </div>

                <button id="btn-save-shape" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 flex flex-col items-center">
                    <span class="text-lg">✨ ¡Completar!</span>
                    <span class="text-[9px] opacity-80">(Gana estrellas por cada lado)</span>
                </button>

                <div class="grid grid-cols-1 gap-2 mt-2">
                    <button id="btn-open-rewards" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-2xl shadow-md flex items-center justify-center gap-2">
                        🏆 Medallas
                    </button>
                    <button id="btn-open-pets" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-2xl shadow-md flex items-center justify-center gap-2">
                        🐾 Mascotas
                    </button>
                </div>
            </div>

            <!-- Controles 6to Grado -->
            <div id="controls-geometry" class="hidden flex flex-col gap-4">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-2 text-center">Configurar Polígono</label>
                    <input type="range" id="reg-sides" min="3" max="12" value="6" class="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer">
                    <div class="flex justify-between text-[10px] text-slate-400 mt-1"><span>3</span><span>12 lados</span></div>
                </div>
                <button id="btn-add-regular" class="bg-indigo-600 text-white font-bold py-3 rounded-2xl shadow-md hover:bg-indigo-700">Calcular Perímetro/Área</button>
                <div id="geometry-challenge" class="hidden space-y-2">
                    <input type="number" id="input-p" class="w-full p-3 bg-indigo-50 border-2 border-indigo-100 rounded-xl" placeholder="Perímetro">
                    <input type="number" id="input-a" class="w-full p-3 bg-indigo-50 border-2 border-indigo-100 rounded-xl" placeholder="Área">
                    <button id="btn-verify" class="w-full bg-orange-500 text-white py-2 rounded-xl font-bold">Verificar</button>
                </div>
            </div>

            <div class="mt-auto space-y-2">
                <button id="btn-reset-all" class="w-full text-red-400 text-[10px] font-bold uppercase py-2">Borrar Lienzo</button>
            </div>
        </div>

        <!-- Canvas -->
        <div class="flex-grow bg-white rounded-[2.5rem] shadow-inner border-8 border-slate-50 canvas-container overflow-hidden" id="canvas-wrapper">
            <canvas id="polygonCanvas"></canvas>
            
            <!-- Mascota Activa en Pantalla -->
            <div id="active-pet-container" class="hidden">
                <div class="speech-bubble" id="pet-speech">¡Hola! Vamos a dibujar.</div>
                <div class="pet-sprite" id="pet-display">🐱</div>
            </div>

            <!-- Mensaje Feedback -->
            <div id="feedback-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center transition-opacity duration-500 opacity-0 z-50">
                <div id="feedback-message" class="bg-white/90 backdrop-blur p-8 rounded-[3rem] shadow-2xl text-center border-4"></div>
            </div>

            <!-- Ayuda Visual -->
            <div class="absolute bottom-6 left-6 text-[10px] text-slate-400 bg-white/50 px-3 py-1 rounded-full italic">
                Cierra la figura pulsando el primer punto rojo
            </div>
        </div>
    </main>

    <!-- MODAL DE PREMIOS (MEDALLAS) -->
    <div id="reward-modal">
        <div class="bg-white rounded-[3rem] shadow-2xl p-10 max-w-xl w-full mx-4 border-8 border-pink-100">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black text-pink-600">🏆 Mis Medallas</h2>
                <button onclick="document.getElementById('reward-modal').style.display='none'" class="bg-slate-100 p-2 rounded-full hover:bg-slate-200">✕</button>
            </div>
            <div id="stickers-grid" class="grid grid-cols-3 gap-6 h-72 overflow-y-auto pr-2"></div>
            <div class="mt-8 p-4 bg-yellow-50 rounded-2xl border-2 border-yellow-200 flex justify-between items-center">
                <span class="text-xl font-black text-yellow-800"><span id="reward-stars">0</span> ⭐</span>
            </div>
        </div>
    </div>

    <!-- MODAL DE MASCOTAS -->
    <div id="pets-modal">
        <div class="bg-white rounded-[3rem] shadow-2xl p-10 max-w-2xl w-full mx-4 border-8 border-orange-100">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black text-orange-600">🐾 Mascotas Sabias</h2>
                <button onclick="document.getElementById('pets-modal').style.display='none'" class="bg-slate-100 p-2 rounded-full hover:bg-slate-200">✕</button>
            </div>
            
            <div id="pets-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-4 h-80 overflow-y-auto pr-2">
                <!-- Se llena con JS -->
            </div>

            <div class="mt-6 p-4 bg-orange-50 rounded-2xl border-2 border-orange-200 flex justify-between items-center">
                <span class="text-xl font-black text-orange-800"><span id="pet-stars-display">0</span> ⭐</span>
                <p class="text-xs text-orange-600 font-bold">¡Desbloquea amigos para recibir consejos!</p>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('polygonCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('canvas-wrapper');
            
            let state = {
                stars: 0,
                grade: 0,
                points: [],
                shapes: [],
                isClosed: false,
                unlockedMedals: [0],
                unlockedPets: [],
                activePet: null
            };

            const PREMIOS = [
                { id: 0, name: "Primer Trazo", icon: "🌱", cost: 0 },
                { id: 1, name: "Dibujante", icon: "🖍️", cost: 20 },
                { id: 2, name: "Geómetra", icon: "📐", cost: 50 },
                { id: 3, name: "Estrella", icon: "🌟", cost: 100 },
                { id: 4, name: "Maestro", icon: "👑", cost: 250 },
                { id: 5, name: "Arquitecto", icon: "🏰", cost: 500 }
            ];

            const MASCOTAS = [
                { id: 0, name: "Gatito", icon: "🐱", cost: 50 },
                { id: 1, name: "Perrito", icon: "🐶", cost: 100 },
                { id: 2, name: "Conejito", icon: "🐰", cost: 150 },
                { id: 3, name: "Zorrito", icon: "🦊", cost: 250 },
                { id: 4, name: "Osito", icon: "🐻", cost: 400 },
                { id: 5, name: "Panda", icon: "🐼", cost: 600 },
                { id: 6, name: "León", icon: "🦁", cost: 900 },
                { id: 7, name: "Tigre", icon: "🐯", cost: 1200 },
                { id: 8, name: "Dino", icon: "🦖", cost: 1600 },
                { id: 9, name: "Unicornio", icon: "🦄", cost: 2100 },
                { id: 10, name: "Búho Sabio", icon: "🦉", cost: 2700 },
                { id: 11, name: "Mago", icon: "🧙", cost: 3500 },
                { id: 12, name: "Robot", icon: "🤖", cost: 4500 },
                { id: 13, name: "Alienígena", icon: "👽", cost: 6000 },
                { id: 14, name: "Dragón", icon: "🐲", cost: 8000 }
            ];

            const CONSEJOS = [
                "¡Un triángulo tiene 3 lados!",
                "¡Cierra tu figura uniendo los puntos!",
                "¿Sabías que un cuadrado tiene 4 lados iguales?",
                "¡Sigue así, vas por buen camino!",
                "Un polígono es una figura cerrada.",
                "¡El círculo no es un polígono!",
                "¡Dibuja un hexágono, tiene 6 lados!",
                "¡Cada punto se llama vértice!",
                "¡Gana estrellas dibujando más lados!",
                "¡Las figuras grandes son geniales!",
                "¡Prueba a hacer un pentágono de 5 lados!",
                "¡Usa colores diferentes para cada figura!"
            ];

            function resize() {
                canvas.width = wrapper.clientWidth;
                canvas.height = wrapper.clientHeight;
                render();
            }
            window.onresize = resize;
            resize();

            // Interacción de Dibujo
            canvas.addEventListener('mousedown', (e) => {
                if (state.isClosed) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (state.points.length >= 3) {
                    const d = Math.hypot(x - state.points[0].x, y - state.points[0].y);
                    if (d < 20) {
                        state.isClosed = true;
                        render();
                        return;
                    }
                }
                state.points.push({x, y});
                document.getElementById('current-points-display').innerText = state.points.length;
                render();
            });

            // Guardar figura
            document.getElementById('btn-save-shape').onclick = () => {
                if (!state.isClosed) {
                    showFeedback("¡Une los puntos con el círculo rojo!", "border-yellow-400 text-yellow-600");
                    return;
                }

                const starsGained = 10 + (state.points.length - 3) * 5;
                state.stars += starsGained;
                state.grade = Math.min(5, state.grade + 0.2);
                
                state.shapes.push({
                    points: [...state.points],
                    color: `hsl(${Math.random() * 360}, 70%, 60%)`
                });

                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#fbbf24', '#f59e0b', '#ffffff']
                });

                showFeedback(`⭐ ¡+${starsGained} Estrellas!`, "border-green-500 text-green-700");
                
                state.points = [];
                state.isClosed = false;
                document.getElementById('current-points-display').innerText = "0";
                updateUI();
                render();
            };

            function updateUI() {
                document.getElementById('stars-count').innerText = state.stars;
                document.getElementById('grade-display').innerText = state.grade.toFixed(1);
                document.getElementById('pet-stars-display').innerText = state.stars;
                document.getElementById('reward-stars').innerText = state.stars;
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath(); ctx.strokeStyle = "#f1f5f9";
                for(let x=0; x<canvas.width; x+=40) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
                for(let y=0; y<canvas.height; y+=40) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
                ctx.stroke();

                state.shapes.forEach(s => {
                    ctx.beginPath();
                    ctx.fillStyle = s.color + "44"; ctx.strokeStyle = s.color; ctx.lineWidth = 2;
                    ctx.moveTo(s.points[0].x, s.points[0].y);
                    s.points.forEach(p => ctx.lineTo(p.x, p.y));
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                });

                if (state.points.length > 0) {
                    ctx.beginPath();
                    ctx.setLineDash(state.isClosed ? [] : [5, 5]);
                    ctx.strokeStyle = "#4f46e5"; ctx.lineWidth = 3;
                    ctx.moveTo(state.points[0].x, state.points[0].y);
                    state.points.forEach(p => ctx.lineTo(p.x, p.y));
                    if (state.isClosed) { ctx.closePath(); ctx.fillStyle = "#4f46e522"; ctx.fill(); }
                    ctx.stroke(); ctx.setLineDash([]);
                    state.points.forEach((p, i) => {
                        ctx.beginPath(); ctx.arc(p.x, p.y, i === 0 ? 8 : 4, 0, Math.PI*2);
                        ctx.fillStyle = i === 0 ? "#ef4444" : "#4f46e5"; ctx.fill();
                    });
                }
            }

            // --- Modales Recompensas ---
            document.getElementById('btn-open-rewards').onclick = () => {
                const grid = document.getElementById('stickers-grid');
                grid.innerHTML = "";
                PREMIOS.forEach(p => {
                    const isUnlocked = state.unlockedMedals.includes(p.id);
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-3xl border-2 text-center sticker-card ${isUnlocked ? 'bg-pink-50 border-pink-200' : 'bg-slate-50 border-slate-100 locked'}`;
                    card.innerHTML = `
                        <div class="text-4xl mb-2 ${isUnlocked ? 'badge-anim' : ''}">${p.icon}</div>
                        <div class="text-[10px] font-black uppercase text-slate-500">${p.name}</div>
                        ${!isUnlocked ? `<button onclick="buyPremio(${p.id}, ${p.cost})" class="mt-2 bg-indigo-500 text-white text-[9px] px-3 py-1 rounded-full font-bold">${p.cost} ⭐</button>` : '<span class="text-[9px] text-pink-500 font-bold">¡Tuyo!</span>'}
                    `;
                    grid.appendChild(card);
                });
                document.getElementById('reward-modal').style.display = 'flex';
            };

            window.buyPremio = (id, cost) => {
                if (state.stars >= cost) {
                    state.stars -= cost; state.unlockedMedals.push(id);
                    updateUI(); document.getElementById('btn-open-rewards').onclick();
                    confetti({ colors: ['#ec4899', '#ffffff'] });
                }
            };

            // --- Sistema de Mascotas ---
            document.getElementById('btn-open-pets').onclick = () => {
                const grid = document.getElementById('pets-grid');
                grid.innerHTML = "";
                MASCOTAS.forEach(p => {
                    const isUnlocked = state.unlockedPets.includes(p.id);
                    const isActive = state.activePet === p.id;
                    const card = document.createElement('div');
                    card.className = `p-3 rounded-2xl border-2 text-center pet-card ${isUnlocked ? (isActive ? 'bg-orange-200 border-orange-500' : 'bg-orange-50 border-orange-200') : 'bg-slate-50 border-slate-100 locked'}`;
                    
                    card.onclick = () => {
                        if (isUnlocked) {
                            state.activePet = p.id;
                            updatePetDisplay();
                            document.getElementById('btn-open-pets').onclick();
                        }
                    };

                    card.innerHTML = `
                        <div class="text-3xl mb-1">${p.icon}</div>
                        <div class="text-[9px] font-bold truncate">${p.name}</div>
                        ${!isUnlocked ? `<button onclick="event.stopPropagation(); buyPet(${p.id}, ${p.cost})" class="mt-1 bg-orange-500 text-white text-[8px] px-2 py-1 rounded-full font-bold w-full">${p.cost}⭐</button>` : `<span class="text-[8px] ${isActive ? 'text-orange-700 font-bold' : 'text-orange-400'}">${isActive ? 'ACTIVO' : 'ELEGIR'}</span>`}
                    `;
                    grid.appendChild(card);
                });
                document.getElementById('pets-modal').style.display = 'flex';
            };

            window.buyPet = (id, cost) => {
                if (state.stars >= cost) {
                    state.stars -= cost;
                    state.unlockedPets.push(id);
                    state.activePet = id;
                    updateUI();
                    updatePetDisplay();
                    document.getElementById('btn-open-pets').onclick();
                    confetti({ colors: ['#f97316', '#ffffff'] });
                } else {
                    alert("¡Necesitas más estrellas para este amigo!");
                }
            };

            function updatePetDisplay() {
                const container = document.getElementById('active-pet-container');
                if (state.activePet !== null) {
                    container.classList.remove('hidden');
                    const pet = MASCOTAS.find(m => m.id === state.activePet);
                    document.getElementById('pet-display').innerText = pet.icon;
                    rotateConsejos();
                }
            }

            function rotateConsejos() {
                if (state.activePet === null) return;
                const bubble = document.getElementById('pet-speech');
                const randomConsejo = CONSEJOS[Math.floor(Math.random() * CONSEJOS.length)];
                bubble.innerText = randomConsejo;
            }

            // Intervalo de consejos cada 10 segundos
            setInterval(rotateConsejos, 10000);

            function showFeedback(html, classes) {
                const ov = document.getElementById('feedback-overlay');
                const msg = document.getElementById('feedback-message');
                msg.innerHTML = html;
                msg.className = `bg-white/90 backdrop-blur p-8 rounded-[3rem] shadow-2xl text-center border-4 font-black text-xl ${classes}`;
                ov.style.opacity = "1";
                setTimeout(() => ov.style.opacity = "0", 2500);
            }

            // Tabs y Reset
            document.getElementById('tab-explorer').onclick = () => {
                document.getElementById('controls-explorer').classList.remove('hidden');
                document.getElementById('controls-geometry').classList.add('hidden');
                document.getElementById('tab-explorer').className = "px-6 py-3 tab-active";
                document.getElementById('tab-geometry').className = "px-6 py-3 text-gray-500";
            };
            document.getElementById('tab-geometry').onclick = () => {
                document.getElementById('controls-geometry').classList.remove('hidden');
                document.getElementById('controls-explorer').classList.add('hidden');
                document.getElementById('tab-geometry').className = "px-6 py-3 tab-active";
                document.getElementById('tab-explorer').className = "px-6 py-3 text-gray-500";
            };
            document.getElementById('btn-reset-all').onclick = () => {
                if(confirm("¿Borrar dibujos?")) { state.shapes = []; state.points = []; render(); }
            };
        });
    </script>
</body>
</html>
